<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Dogs Go To Minecraft</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="zone-label">Zone: Loading...</div>
    <div id="hint"></div>
    <div id="health"><div class="health-fill"></div><div class="health-ticks"></div></div>
    <div id="stamina"><div class="stamina-fill"></div><div class="stamina-ticks"></div></div>
  </div>

  <div id="hotbar"></div>

  <div id="inventory" hidden></div>

  <div id="sign-editor" hidden>
    <div class="sign-win">
      <div class="sign-title">Sign Text</div>
      <textarea id="sign-text" rows="4" maxlength="120" spellcheck="false"></textarea>
      <div class="sign-actions">
        <button class="sign-btn" id="sign-save">Save</button>
      </div>
      <div class="sign-hint">Enter to save &bull; Esc to cancel &bull; up to 4 lines</div>
    </div>
  </div>

  <div id="overlay">
    <h1>All Dogs Go To Minecraft</h1>
    <p id="overlay-title">The Testing Zone</p>
    <p id="overlay-text">Click to start</p>
    <div class="overlay-buttons">
      <button class="overlay-btn creative" id="overlay-creative">Creative</button>
      <button class="overlay-btn" id="overlay-instructions">Instructions</button>
    </div>
  </div>

  <script src="../lib/three.min.js"></script>
  <script src="../js/core/constants.js"></script>
  <script src="../js/world/blocks.js"></script>
  <script src="../js/world/textures.js"></script>
  <script src="../js/world/worldgen.js"></script>
  <script src="../js/world/world.js"></script>
  <script src="../js/world/structures/structure.js"></script>
  <script src="../js/world/structures/house.js"></script>
  <script src="../js/world/worldSave.js"></script>
  <script src="../js/world/drops.js"></script>
  <script src="../js/entity/entity.js"></script>
  <script src="../js/entity/pathfinder.js"></script>
  <script src="../js/entity/goap.js"></script>
  <script src="../js/entity/mob.js"></script>
  <script src="../js/entity/mobCollision.js"></script>
  <script src="../js/entity/sign.js"></script>
  <script src="../js/entity/chest.js"></script>
  <script src="../js/entity/entityManager.js"></script>
  <script src="../js/movement/input.js"></script>
  <script src="../js/movement/player.js"></script>
  <script src="../js/crafting/inventory.js"></script>
  <script src="../js/crafting/recipes.js"></script>
  <script src="../js/crafting/crafting.js"></script>
  <script src="../js/zones/zone.js"></script>
  <script src="../js/zones/zoneManager.js"></script>
  <script src="../js/zones/testing.js"></script>
  <script src="../js/core/raycast.js"></script>
  <script src="../js/ui/icons.js"></script>
  <script src="../js/ui/hud.js"></script>
  <script src="../js/ui/hotbar.js"></script>
  <script src="../js/ui/stamina.js"></script>
  <script src="../js/ui/health.js"></script>
  <script src="../js/ui/signEditor.js"></script>
  <script src="../js/ui/inventoryPanel.js"></script>
  <script src="../js/ui/debug.js"></script>
  <script src="../js/ui/menuDebug.js"></script>
  <script src="../js/ui/pauseMenu.js"></script>
  <script src="../js/mods/meshAI.js"></script>
  <script src="../js/mods/meshFactory.js"></script>
  <script src="../js/mods/manifest.js"></script>
  <script src="../js/mods/modLoader.js"></script>
  <script src="../js/core/game.js"></script>
  <script>window.ADSGTM_AUTOSTART = true;</script>
  <script src="../js/main.js"></script>

  <script>
  (function () {
    var errors = [];
    window.addEventListener('error', function (e) { errors.push(String(e.message)); });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      errors.push('REJ:' + String(r && r.message ? r.message : r));
    });
    var results = [];

    function report() {
      var el = document.createElement('div');
      el.id = 'smoke-result';
      el.setAttribute('data-smoke', results.join(' | '));
      el.setAttribute('data-errors', errors.join(' ;; '));
      document.body.appendChild(el);
    }

    var tries = 0;
    function run() {
      tries++;
      if (!window.game || !(window.game instanceof AllDogs.Game)) {
        if (tries < 400) return setTimeout(run, 25);
        results.push('NOGAME');
        return report();
      }
      var g = window.game;
      try {
        results.push('renderer=' + (g.renderer ? 1 : 0));
        results.push('boot=1');

        // --- Player health and health bar --------------------------------
        results.push('healthBar=' + (g.healthBar && g.healthBar.root ? 1 : 0));
        results.push('healthTicks=' + (document.querySelector('#health .health-ticks') ? 1 : 0));
        var hp0 = g.player.health;
        g.player.damage(30);
        var hp1 = g.player.health;
        g.player.damage(9999);
        var hp2 = g.player.health;
        results.push('healthDamage=' + (hp0 === AllDogs.constants.PLAYER_MAX_HEALTH &&
          hp1 === hp0 - 30 && hp2 === 0 ? 1 : 0));
        results.push('healthNoDeath=' + (g.player && g.player.pos && g.player.health === 0 ? 1 : 0));
        g.player.health = 30;
        g.healthBar.update(g.player);
        results.push('healthFill=' + (parseFloat(g.healthBar.fill.style.width) === 30 ? 1 : 0));
        g.player.health = g.player.maxHealth;
        g.healthBar.update(g.player);
        results.push('healthFull=' + (parseFloat(g.healthBar.fill.style.width) === 100 ? 1 : 0));

        results.push('used=' + g.inventory.usedSlots() + '/' + g.inventory.capacity);
        results.push('slots=' + JSON.stringify(g.inventory.slots.map(function (s) { return s ? s.id + ':' + s.qty : null; })));

        var n = 0, furnId = null;
        for (var id in AllDogs.blocks.BLOCK_DEFS) {
          var d = AllDogs.blocks.BLOCK_DEFS[id];
          if (d && d.schema && d.texture && /furnace/i.test(d.texture)) {
            n++;
            if (furnId === null) furnId = Number(id);
          }
        }
        results.push('furnSchema=' + n);
        results.push('furnId=' + furnId);

        g.openFurnace({ x: 1, y: 2, z: 3 });
        results.push('open=' + (g.inventoryOpen ? 1 : 0));
        results.push('mode=' + (g.panelOpts().mode || 'none'));
        results.push('hidden=' + (g.panel.el.hidden ? 1 : 0));

        var f = g.furnaces['1,2,3'];
        f.slots[0] = { id: 'dirt', qty: 1 };
        g.updateFurnaces(11);
        results.push('out=' + (f.out ? f.out.id + ':' + f.out.qty : 'null'));
        results.push('in=' + (f.slots[0] ? f.slots[0].id : 'null'));

        g.inventoryOpen = false;
        g.panel.close();
        g.openFurnaceKey = null;

        var px = Math.floor(g.player.pos.x);
        var pz = Math.floor(g.player.pos.z);
        var y = Math.floor(g.player.pos.y) - 1;
        g.world.set(px, y, pz - 2, furnId);
        var hit = { x: px, y: y, z: pz - 2, blockId: furnId, fx: 0, fy: 1, fz: 0, onX: 0.5, onY: 1, onZ: 0.5 };
        g.target = hit;
        g.tryPlace();
        results.push('clickOpen=' + (g.inventoryOpen ? 1 : 0));
        results.push('clickMode=' + (g.panelOpts().mode || 'none'));

        g.inventoryOpen = false;
        g.panel.close();
        g.openFurnaceKey = null;
        g.player.state = 'crouch';
        g.target = hit;
        g.tryBreak();
        results.push('crouchOpen=' + (g.inventoryOpen ? 1 : 0));
        results.push('blockStill=' + (g.world.get(px, y, pz - 2) === furnId ? 1 : 0));
        g.player.state = 'stand';

        var WG = AllDogs.worldgen;
        results.push('wg=' + (WG ? 1 : 0));
        results.push('h00=' + WG.heightAt(0, 0));
        results.push('surf=' + WG.blockAt(0, WG.heightAt(0, 0), 0));
        results.push('air=' + WG.blockAt(0, WG.heightAt(0, 0) + 40, 0));
        results.push('rock=' + WG.blockAt(3, 0, 3));
        results.push('far=' + WG.heightAt(12000, -8431));

        g.world.clear();
        var _t0 = (performance || Date).now();
        g.world.updateChunks(0, 0, 2, 16, g.worldGroup, 1000, 10000);
        var _t1 = (performance || Date).now();
        results.push('buildAll=' + (_t1 - _t0).toFixed(1) + 'ms/' + g.world.chunkMeshes.size);
        g.world.clear();
        var _bt = 0, _calls = 0, _slow = [];
        for (var _f = 0; _f < 200 && g.world.chunkMeshes.size < 121; _f++) {
          var _s = (performance || Date).now();
          g.world.updateChunks(0, 0, 5, 16, g.worldGroup, 1, 6);
          var _e = (performance || Date).now();
          if (_e - _s > _bt) _bt = _e - _s;
          _slow.push([Math.round(_e - _s), _f]);
          _calls++;
        }
        _slow.sort(function (a, b) { return b[0] - a[0]; });
        results.push('streamMax=' + _bt.toFixed(1) + 'ms,calls=' + _calls + ',chunks=' + g.world.chunkMeshes.size);
        results.push('topSlow=' + _slow.slice(0, 5).map(function (x) { return x[0] + '@' + x[1]; }).join(','));
        g.world.clear();
        g.world.updateChunks(0, 0, 2, 16, g.worldGroup, 1000, 10000);
        results.push('chunks=' + g.world.chunkMeshes.size);
        results.push('meshes=' + g.world.collectMeshes().length);
        results.push('gen=' + g.world.get(0, WG.heightAt(0, 0), 0));
        function meshSig() {
          var ms = g.world.collectMeshes();
          var v = 0, m = 0;
          for (var mi = 0; mi < ms.length; mi++) {
            m++;
            var pa = ms[mi].geometry.getAttribute('position');
            if (pa) v += pa.count;
          }
          return m + ':' + v;
        }
        var sigBefore = meshSig();
        g.world.set(0, WG.heightAt(0, 0), 0, 0);
        results.push('broke=' + g.world.get(0, WG.heightAt(0, 0), 0));
        g.world.rebuildChunk(0, 0, 16, g.worldGroup);
        var sigAfter = meshSig();
        results.push('meshSig=' + sigBefore + '->' + sigAfter + ',changed=' + (sigBefore === sigAfter ? 0 : 1));
        results.push('afterRebuild=' + g.world.get(0, WG.heightAt(0, 0), 0));
        g.world.set(0, WG.heightAt(0, 0), 0, 0);
        g.world.set(0, WG.heightAt(0, 0), 0, AllDogs.blocks.BLOCK.GRASS);
        results.push('restored=' + g.world.get(0, WG.heightAt(0, 0), 0));

        g.world.clear();
        g.world.updateChunks(0, 0, 2, 16, g.worldGroup, 1000, 10000);
        g.worldMeshes = g.world.collectMeshes();
        var gh = WG.heightAt(0, 0);
        var gameSig = function () {
          var ms = g.worldMeshes; var v = 0;
          for (var gi = 0; gi < ms.length; gi++) {
            var pa = ms[gi].geometry.getAttribute('position');
            if (pa) v += pa.count;
          }
          return ms.length + ':' + v;
        };
        var gsBefore = gameSig();
        g.world.set(0, gh, 0, 0);
        g.rebuildChunksFor(0, gh, 0);
        var gsAfter = gameSig();
        results.push('gamePath=' + gsBefore + '->' + gsAfter + ',changed=' + (gsBefore === gsAfter ? 0 : 1));
        results.push('gameBroke=' + g.world.get(0, gh, 0));

        var ST = AllDogs.structures;
        results.push('st=' + (ST ? 1 : 0));
        results.push('hdef=' + (ST && ST.get('house') ? 1 : 0));
        g.world.clear();
        var found = [];
        for (var cxx = -4; cxx <= 4; cxx++) {
          for (var czz = -4; czz <= 4; czz++) {
            var ps = ST.placements(cxx, czz);
            for (var q = 0; q < ps.length; q++) {
              var pp = ps[q];
              if (pp.def.name !== 'house') continue;
              var dup = false;
              for (var f2 = 0; f2 < found.length; f2++) {
                if (found[f2].x === pp.x && found[f2].z === pp.z) dup = true;
              }
              if (!dup) found.push(pp);
            }
          }
        }
        results.push('houses=' + found.length);
        var furnOk = 0, furnBad = 0;
        for (var fh = 0; fh < found.length; fh++) {
          var hh = found[fh];
          for (var fcxx = Math.floor((hh.x - 1) / 16); fcxx <= Math.floor((hh.x + hh.size) / 16); fcxx++) {
            for (var fczz = Math.floor((hh.z - 1) / 16); fczz <= Math.floor((hh.z + hh.size) / 16); fczz++) {
              g.world.ensureChunk(fcxx, fczz);
            }
          }
          for (var fdx = -1; fdx <= hh.size; fdx++) {
            for (var fdz = -1; fdz <= hh.size; fdz++) {
              for (var fdy = 0; fdy < hh.variant.height; fdy++) {
                var fbid = g.world.get(hh.x + fdx, hh.base + fdy, hh.z + fdz);
                var fbd = AllDogs.blocks.BLOCK_DEFS[fbid];
                if (fbd && fbd.texture && /furnace/i.test(fbd.texture)) {
                  if ((fbd.yaw || 0) === (hh.turns % 4)) furnOk++; else furnBad++;
                }
              }
            }
          }
        }
        results.push('furnAll=' + furnOk + '/' + (furnOk + furnBad));
        g.world.clear();
        if (found.length) {
          var h = found[0];
          results.push('hpos=' + h.x + ',' + h.base + ',' + h.z);
          results.push('hsize=' + h.size);
          results.push('hturns=' + h.turns);
          for (var ecx = Math.floor((h.x - 1) / 16); ecx <= Math.floor((h.x + h.size) / 16); ecx++) {
            for (var ecz = Math.floor((h.z - 1) / 16); ecz <= Math.floor((h.z + h.size) / 16); ecz++) {
              g.world.ensureChunk(ecx, ecz);
            }
          }
          var ents = ST.entitiesFor(Math.floor(h.x / 16), Math.floor(h.z / 16));
          results.push('hents=' + ents.length);
          results.push('htypes=' + ents.map(function (e) { return e.type; }).join('+'));
          var sign = null, chest = 0;
          for (var z2 = 0; z2 < ents.length; z2++) {
            if (ents[z2].type === 'sign') sign = ents[z2];
            if (ents[z2].type === 'chest') chest++;
          }
          results.push('hsign=' + (sign && sign.text ? sign.text[0] : 'none'));
          results.push('hchest=' + chest);
          var fcount = 0;
          var fyaw = -1;
          for (var dx = -1; dx <= h.size; dx++) {
            for (var dz = -1; dz <= h.size; dz++) {
              for (var dy = 0; dy < h.variant.height; dy++) {
                var bid = g.world.get(h.x + dx, h.base + dy, h.z + dz);
                var bd = AllDogs.blocks.BLOCK_DEFS[bid];
                if (bd && bd.texture && /furnace/i.test(bd.texture)) {
                  fcount++;
                  fyaw = (bd.yaw || 0);
                }
              }
            }
          }
          results.push('hfurn=' + fcount);
          results.push('fyaw=' + fyaw + ',expect=' + (h.turns % 4));

          var sb = null;
          for (var sdx = 0; sdx < h.size && !sb; sdx++) {
            for (var sdz = 0; sdz < h.size && !sb; sdz++) {
              for (var sdy = 0; sdy < h.variant.height; sdy++) {
                var sid = ST.blockAt(h.x + sdx, h.base + sdy, h.z + sdz);
                if (sid) { sb = { x: h.x + sdx, y: h.base + sdy, z: h.z + sdz, id: sid }; break; }
              }
            }
          }
          if (sb) {
            var scx = Math.floor(sb.x / 16), scz = Math.floor(sb.z / 16);
            results.push('sbpos=' + sb.x + ',' + sb.y + ',' + sb.z + ',id=' + sb.id);
            results.push('sbBefore=' + g.world.get(sb.x, sb.y, sb.z));
            g.world.set(sb.x, sb.y, sb.z, 0);
            g.world.rebuildChunk(scx, scz, 16, g.worldGroup);
            results.push('sbAfterBreak=' + g.world.get(sb.x, sb.y, sb.z));
            g.world.set(sb.x, sb.y, sb.z, sb.id);
            g.world.rebuildChunk(scx, scz, 16, g.worldGroup);
            results.push('sbRestored=' + g.world.get(sb.x, sb.y, sb.z));
          } else {
            results.push('sbNONE');
          }

          g.player.pos.set(h.x + 0.5, h.base + 2, h.z + 0.5);
          for (var uf = 0; uf < 40; uf++) {
            g.world.updateChunks(g.player.pos.x, g.player.pos.z, 2, 16, g.worldGroup, 1000, 10000);
          }
          g.syncStructureChunks();
          var sc = 0, ss = 0;
          for (var ei = 0; ei < g.entityManager.entities.length; ei++) {
            var et = g.entityManager.entities[ei].type;
            if (et === 'chest') sc++;
            if (et === 'sign') ss++;
          }
          results.push('emChest=' + sc);
          results.push('emSign=' + ss);
        }

        var wsx = Math.floor(g.player.pos.x) + 3;
        var wsz = Math.floor(g.player.pos.z) + 3;
        var wsy = AllDogs.worldgen.heightAt(wsx, wsz) + 1;
        g.world.set(wsx, wsy, wsz, AllDogs.blocks.BLOCK.PLANKS);
        var saveBefore = g.world.get(wsx, wsy, wsz);
        var saveText = AllDogs.worldSave.serialize(g);
        var saveParsed = AllDogs.worldSave.parse(saveText);
        results.push('saveSeed=' + saveParsed.seed + ',seedEq=' + (saveParsed.seed === AllDogs.worldgen.getSeed() ? 1 : 0));
        results.push('saveBlocks=' + saveParsed.blocks.length + ',ver=' + saveParsed.version);
        g.world.set(wsx, wsy, wsz, 0);
        AllDogs.worldSave.apply(g, saveParsed);
        results.push('saveRoundtrip=' + saveBefore + '->' + g.world.get(wsx, wsy, wsz));

        var chestSchema = AllDogs.entitySchemas ? AllDogs.entitySchemas.get('chest') : null;
        results.push('chestSchema=' + (chestSchema ? 1 : 0));
        if (chestSchema) {
          var cwx = Math.floor(g.player.pos.x) + 6.5;
          var cwz = Math.floor(g.player.pos.z) + 0.5;
          var cwy = AllDogs.worldgen.heightAt(Math.floor(cwx), Math.floor(cwz)) + 1;
          var chestEnt = g.entityManager.create('chest', {
            pos: { x: cwx, y: cwy, z: cwz },
            yaw: 0
          });
          g.entityManager.add(chestEnt);
          chestEnt.interact(g);
          results.push('chestOpen=' + (g.panelOpts().mode === 'container' ? 1 : 0));
          g.inventory.add('dirt', 2);
          var dirtIdx = g.inventory.indexOf('dirt');
          var chestMoved = g.activeContainer.handleMove(g, 'inv', dirtIdx, 'chest', 0, 1);
          results.push('chestMove=' + (chestMoved && g.activeContainer.slots[0]
            ? g.activeContainer.slots[0].id + ':' + g.activeContainer.slots[0].qty
            : 'fail'));
          var chestSaveParsed = AllDogs.worldSave.parse(AllDogs.worldSave.serialize(g));
          var chestSaved = false;
          for (var chi = 0; chi < chestSaveParsed.chests.length; chi++) {
            var chr = chestSaveParsed.chests[chi];
            if (chr.x === chestEnt.pos.x && chr.y === chestEnt.pos.y && chr.z === chestEnt.pos.z) {
              chestSaved = !!(chr.slots[0] && chr.slots[0][0] === 'dirt' && chr.slots[0][1] === 1);
            }
          }
          results.push('chestSaved=' + (chestSaved ? 1 : 0));
          var dirtBefore = 0;
          for (var dsi = 0; dsi < g.drops.stacks.length; dsi++) {
            if (g.drops.stacks[dsi].itemId === 'dirt') dirtBefore += g.drops.stacks[dsi].qty;
          }
          g.closeContainerUI();
          chestSchema.onDestroy({ game: g, entity: chestEnt });
          var dirtAfter = 0;
          for (var dsj = 0; dsj < g.drops.stacks.length; dsj++) {
            if (g.drops.stacks[dsj].itemId === 'dirt') dirtAfter += g.drops.stacks[dsj].qty;
          }
          results.push('chestDrop=' + (dirtAfter - dirtBefore));

          // Modifier-aware quick-move and zone-aware drag distribution.
          for (var cini = 0; cini < g.inventory.capacity; cini++) g.inventory.set(cini, null);
          chestEnt.interact(g);
          g.inventory.set(0, { id: 'stone', qty: 2 });
          g.quickMove('inv', 0, true, 'shift');
          var shiftSlot = g.activeContainer.slots[0];
          results.push('shiftHotbarToGui=' + (shiftSlot && shiftSlot.id === 'stone' &&
            shiftSlot.qty === 2 && !g.inventory.get(0) ? 1 : 0));

          g.inventory.set(10, { id: 'sand', qty: 1 });
          g.quickMove('inv', 10, true, 'ctrl');
          var ctrlLeftChest = true;
          for (var csi = 0; csi < g.activeContainer.slots.length; csi++) {
            var cs = g.activeContainer.slots[csi];
            if (cs && cs.id === 'sand') ctrlLeftChest = false;
          }
          var ctrlHotbar = g.inventory.get(0);
          results.push('ctrlPrefersInv=' + (ctrlLeftChest && ctrlHotbar &&
            ctrlHotbar.id === 'sand' ? 1 : 0));

          g.inventory.set(20, { id: 'clay', qty: 4 });
          var distOk = g.distributeStack(20, 'inv', [
            { zone: 'chest', slot: 3 },
            { zone: 'chest', slot: 4 },
            { zone: 'inv', slot: 25 }
          ], 'split');
          var dist3 = g.activeContainer.slots[3];
          var dist4 = g.activeContainer.slots[4];
          var dist25 = g.inventory.get(25);
          results.push('distributeGui=' + (distOk && dist3 && dist3.id === 'clay' &&
            dist3.qty === 2 && dist4 && dist4.id === 'clay' && dist4.qty === 1 &&
            dist25 && dist25.id === 'clay' && dist25.qty === 1 ? 1 : 0));

          g.inventoryOpen = false;
          g.panel.close();
          g.entityManager.remove(chestEnt);
        }

        // --- Mobs and A* pathfinding -------------------------------------
        var zSchema = AllDogs.entitySchemas ? AllDogs.entitySchemas.get('zombie') : null;
        results.push('zombieSchema=' + (zSchema && zSchema.mob ? 1 : 0));
        var zSpawned = 0;
        for (var zi = 0; zi < g.entityManager.entities.length; zi++) {
          if (g.entityManager.entities[zi].type === 'zombie') zSpawned++;
        }
        results.push('zombiesSpawned=' + zSpawned);

        var zEnt = g.entityManager.create('zombie', { pos: { x: 0.5, y: 20, z: 0.5 } });
        var zBrain = zEnt ? zEnt.brain : null;
        var zOk = !!(zEnt && Math.abs(zEnt.height - 1.8) < 1e-6 &&
          Math.abs((zEnt.bounds.max.y - zEnt.bounds.min.y) - 1.8) < 1e-6 &&
          zEnt.mesh);
        results.push('zombieCreate=' + (zOk ? 1 : 0));
        results.push('goap=' + (AllDogs.goap ? 1 : 0));
        results.push('zombieGoap=' + (zSchema && zSchema.goap ? 1 : 0));
        results.push('zombieBrain=' + (zBrain ? 1 : 0));

        var zbx = Math.floor(g.player.pos.x) + 12;
        var zbz = Math.floor(g.player.pos.z) - 12;
        var zpy = 30;
        for (var zpx = zbx; zpx <= zbx + 4; zpx++) {
          for (var zpz = zbz; zpz <= zbz + 4; zpz++) {
            g.world.set(zpx, zpy, zpz, AllDogs.blocks.BLOCK.STONE);
          }
        }
        var zPath = AllDogs.pathfinder.findPath(
          g.world, zbx + 0.5, zpy + 1, zbz + 0.5,
          zbx + 3.5, zpy + 1, zbz + 3.5,
          { height: 2, maxNodes: 300, maxDistance: 20 }
        );
        results.push('astarPath=' + (zPath && zPath.length >= 2 ? 1 : 0) + ':' + (zPath ? zPath.length : -1));

        g.entityManager.add(zEnt);
        // The legacy movement checks below exercise path following directly,
        // so temporarily take the GOAP brain out of the steering path.
        zEnt.brain = null;
        zEnt.pos.set(zbx + 0.5, zpy + 1, zbz + 0.5);
        zEnt.onGround = true;
        zEnt.path = zPath;
        zEnt.pathIndex = 0;
        zEnt.pathGoal = { x: zbx + 3.5, y: zpy + 1, z: zbz + 3.5 };
        zEnt.pathCooldown = 999;
        var zmx = zEnt.pos.x;
        var zmz = zEnt.pos.z;
        var zMock = {
          world: g.world,
          player: { pos: { x: zbx + 3.5, y: zpy + 1, z: zbz + 3.5 } }
        };
        for (var zm = 0; zm < 20; zm++) zEnt.update(0.05, zMock);
        results.push('mobMoved=' + (Math.abs(zEnt.pos.x - zmx) + Math.abs(zEnt.pos.z - zmz) > 0.1 ? 1 : 0));
        results.push('mobGrounded=' + (zEnt.onGround ? 1 : 0));

        zEnt.moveTo(zEnt.pos.x + 0.4, zEnt.pos.y, zEnt.pos.z, { radius: 1.2 });
        results.push('mobNav=' + (zEnt.nav.active && zEnt.navTarget &&
          zEnt.nav.distance < 1.2 ? 1 : 0));
        zEnt.stopMoving();
        results.push('mobNavStop=' + (!zEnt.nav.active && !zEnt.navTarget ? 1 : 0));

        // A staircase-shaped path across open ground should be string-pulled
        // into a diagonal heading instead of steering along each cell edge.
        zEnt.pos.set(zbx + 0.5, zpy + 1, zbz + 0.5);
        zEnt.path = [
          { x: zbx + 1, y: zpy + 1, z: zbz },
          { x: zbx + 1, y: zpy + 1, z: zbz + 1 },
          { x: zbx + 2, y: zpy + 1, z: zbz + 1 },
          { x: zbx + 2, y: zpy + 1, z: zbz + 2 },
          { x: zbx + 3, y: zpy + 1, z: zbz + 2 }
        ];
        zEnt.pathIndex = 0;
        zEnt._steerPath = null;
        zEnt._steerNode = null;
        zEnt._steerTimer = 0;
        var zNav = zEnt.followPath(g.world);
        results.push('mobSmooth=' + (zNav && Math.abs(zNav.dx) > 0.5 && Math.abs(zNav.dz) > 0.5 ? 1 : 0));

        // --- GOAP planner, idle fast path, and 1000-brain benchmark --------
        zEnt.brain = zBrain;
        var zMockGoap = { player: { pos: { x: 120.5, y: 30, z: 120.5 } } };
        var zFacts = zSchema.goap.facts(zEnt, zMockGoap);
        var zGoal = null;
        var zAttackGoal = null;
        for (var zg = 0; zg < zSchema.goap.goals.length; zg++) {
          if (zSchema.goap.goals[zg].name === 'hunt') zGoal = zSchema.goap.goals[zg];
          if (zSchema.goap.goals[zg].name === 'attack') zAttackGoal = zSchema.goap.goals[zg];
        }
        var zPlan = AllDogs.goap.plan(zSchema.goap, zFacts, zEnt, zMockGoap, { goal: zGoal });
        results.push('goapZombiePlan=' + (zPlan && zPlan.length >= 2 ? 1 : 0) +
          ':' + (zPlan ? zPlan.length : -1));

        // A zombie standing next to the player should plan and land one
        // attack, damage the player, and start its cooldown.
        var hpBeforeAttack = g.player.health;
        g.player.vel.set(0, 0, 0);
        zEnt.pos.set(g.player.pos.x + 0.5, g.player.pos.y, g.player.pos.z);
        zEnt.brain.blackboard.target = g.player;
        zEnt.brain.blackboard.nextAttackAt = 0;
        var zAttackFacts = zSchema.goap.facts(zEnt, g);
        var zAttackPlan = AllDogs.goap.plan(zSchema.goap, zAttackFacts, zEnt, g,
          { goal: zAttackGoal });
        var zAttacked = !!(zAttackPlan && zAttackPlan.length === 1 &&
          zAttackPlan[0].name === 'attackTarget' && zAttackPlan[0].run(zEnt, g));
        results.push('zombieAttackPlan=' + (zAttackPlan && zAttackPlan.length === 1 &&
          zAttackPlan[0].name === 'attackTarget' ? 1 : 0));
        results.push('zombieAttackDamage=' + (zAttacked &&
          g.player.health === hpBeforeAttack - 6 ? 1 : 0));
        results.push('zombieAttackKnockback=' + (g.player.vel.x < -0.5 ? 1 : 0));
        results.push('zombieAttackCooldown=' + (zEnt.brain.blackboard.nextAttackAt >
          (performance || Date).now() ? 1 : 0));
        results.push('entityWeights=' + (g.player.weight === 1 && zEnt.weight === 0.8 ? 1 : 0));
        zEnt.brain.blackboard.target = null;
        zEnt.brain.blackboard.nextAttackAt = 0;
        g.player.health = g.player.maxHealth;
        g.player.vel.set(0, 0, 0);

        // Player melee damages, knocks back, and flashes the zombie instead of
        // deleting it in one click.
        var zPrevHealth = zEnt.health;
        var zHit = zEnt.hit(5, g.player, { knockback: { x: 1, z: 0, speed: 5 } });
        results.push('zombieHitDamage=' + (zHit && zEnt.health === zPrevHealth - 5 ? 1 : 0));
        results.push('zombieHitKnockback=' + (zEnt.vel.x > 0.5 ? 1 : 0));
        results.push('zombieHurtFlash=' + (zEnt.hurtTime > 0 &&
          zEnt.mesh.material.emissive && zEnt.mesh.material.emissive.r > 0.1 ? 1 : 0));
        zEnt.health = zEnt.maxHealth;
        zEnt.hurtTime = 0;
        zEnt.updateHurtFlash();
        zEnt.vel.set(0, 0, 0);
        zEnt.knockbackTime = 0;

        // Player movement ramps toward the target speed instead of snapping.
        var pStance = g.player.stance;
        var pOnGround = g.player.onGround;
        g.player.vel.set(0, 0, 0);
        g.player.stance = 'sprint';
        g.player.onGround = true;
        g.player.updateMomentum(0.016, 8, 0, true);
        results.push('playerMomentum=' + (g.player.vel.x > 0.05 && g.player.vel.x < 8 ? 1 : 0));
        g.player.vel.set(0, 0, 0);
        g.player.stance = pStance;
        g.player.onGround = pOnGround;

        var benchDef = AllDogs.goap.define('__smoke_bench', {
          idleTicks: 60,
          idleJitter: 0,
          facts: function () { return { a: false, b: false }; },
          goals: [{ name: 'bench', priority: 1, desired: { b: true } }],
          actions: [
            { name: 'stepA', pre: { a: false }, effects: { a: true }, instant: true,
              run: function () { return true; } },
            { name: 'stepB', pre: { a: true }, effects: { b: true }, instant: true,
              run: function () { return true; } }
          ]
        });
        var benchGoal = benchDef.goals[0];
        var benchPlan = AllDogs.goap.plan(benchDef, { a: false, b: false }, null, null,
          { goal: benchGoal });
        results.push('goapPlan=' + (benchPlan && benchPlan.length === 2 ? 1 : 0));

        var benchBrains = [];
        for (var bb = 0; bb < 1000; bb++) {
          var benchBrain = AllDogs.goap.createBrain(
            { id: bb, stopMoving: function () {} }, benchDef
          );
          benchBrain.pauseTicks = 60;
          benchBrains.push(benchBrain);
        }
        var idleStart = (performance || Date).now();
        for (var ib = 0; ib < benchBrains.length; ib++) {
          benchBrains[ib].update(0.016, null);
        }
        var idleMs = (performance || Date).now() - idleStart;
        results.push('goapIdle1000=' + idleMs.toFixed(2) + 'ms');
        results.push('goapIdleOk=' + (idleMs < 50 ? 1 : 0));

        var planStart = (performance || Date).now();
        for (var bp = 0; bp < 1000; bp++) {
          AllDogs.goap.plan(benchDef, { a: false, b: false }, null, null,
            { goal: benchGoal });
        }
        var benchMs = (performance || Date).now() - planStart;
        results.push('goapPlan1000=' + benchMs.toFixed(1) + 'ms');

        g.entityManager.remove(zEnt);
        if (zBrain) zBrain.stop();

        // --- Mob / player rigid-body separation ---------------------------
        function overlapsXZ(a, b) {
          var ba = a.bounds;
          var bb = b.bounds;
          var ox = Math.min(ba.max.x, bb.max.x) - Math.max(ba.min.x, bb.min.x);
          var oy = Math.min(ba.max.y, bb.max.y) - Math.max(ba.min.y, bb.min.y);
          var oz = Math.min(ba.max.z, bb.max.z) - Math.max(ba.min.z, bb.min.z);
          return ox > 0.001 && oy > 0.001 && oz > 0.001;
        }

        var colCX = zbx + 2.5;
        var colCZ = zbz + 2.5;
        var colCY = zpy + 1;
        for (var colX = zbx; colX <= zbx + 4; colX++) {
          for (var colZ = zbz; colZ <= zbz + 4; colZ++) {
            g.world.set(colX, zpy + 1, colZ, 0);
            g.world.set(colX, zpy + 2, colZ, 0);
            g.world.set(colX, zpy + 3, colZ, 0);
          }
        }
        var colPrev = { x: g.player.pos.x, y: g.player.pos.y, z: g.player.pos.z };
        g.player.state = 'stand';
        g.player.pos.set(colCX, colCY, colCZ);
        g.player.vel.set(0, 0, 0);

        var colA = g.entityManager.create('zombie', { pos: { x: colCX + 0.2, y: colCY, z: colCZ } });
        var colB = g.entityManager.create('zombie', { pos: { x: colCX, y: colCY, z: colCZ + 0.2 } });
        g.entityManager.add(colA);
        g.entityManager.add(colB);

        var colStart = {
          px: g.player.pos.x, pz: g.player.pos.z,
          ax: colA.pos.x, az: colA.pos.z,
          bx: colB.pos.x, bz: colB.pos.z
        };
        var colBefore = overlapsXZ(g.player, colA) && overlapsXZ(g.player, colB) &&
          overlapsXZ(colA, colB);
        var colMoved = false;
        for (var colStep = 0; colStep < 8; colStep++) {
          if (AllDogs.mobCollision.update(0.016, g)) colMoved = true;
        }
        var colPush =
          Math.abs(g.player.pos.x - colStart.px) + Math.abs(g.player.pos.z - colStart.pz) +
          Math.abs(colA.pos.x - colStart.ax) + Math.abs(colA.pos.z - colStart.az) +
          Math.abs(colB.pos.x - colStart.bx) + Math.abs(colB.pos.z - colStart.bz);
        var colSeparated = !overlapsXZ(g.player, colA) &&
          !overlapsXZ(g.player, colB) && !overlapsXZ(colA, colB);
        var colClear = !g.player.overlapsAt(g.world, g.player.pos.x, g.player.pos.y, g.player.pos.z) &&
          !colA.overlapsAt(g.world, colA.pos.x, colA.pos.y, colA.pos.z) &&
          !colB.overlapsAt(g.world, colB.pos.x, colB.pos.y, colB.pos.z);
        results.push('mobCollide=' + (colBefore && colSeparated ? 1 : 0));
        results.push('mobCollideMoved=' + (colMoved && colPush > 0.05 ? 1 : 0));
        results.push('mobCollideClear=' + (colClear ? 1 : 0));

        // Closing speed should transfer momentum; the fast player slows and
        // the lighter zombie is pushed away.
        colB.pos.set(colCX, colCY, colCZ + 3);
        colB.vel.set(0, 0, 0);
        colA.pos.set(colCX + 0.5, colCY, colCZ);
        colA.vel.set(0, 0, 0);
        g.player.pos.set(colCX, colCY, colCZ);
        g.player.vel.set(6, 0, 0);
        AllDogs.mobCollision.update(0.016, g);
        results.push('collisionImpulse=' + (colA.vel.x > 0.5 && g.player.vel.x < 6 ? 1 : 0));

        g.entityManager.remove(colA);
        g.entityManager.remove(colB);
        g.player.pos.set(colPrev.x, colPrev.y, colPrev.z);
        g.player.vel.set(0, 0, 0);
        g.player.syncCamera(true, 0);
      } catch (err) {
        results.push('EXC:' + String(err && err.message ? err.message : err));
      }
      report();
    }
    setTimeout(run, 50);
  })();
  </script>
</body>
</html>
