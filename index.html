<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Dogs Go To Minecraft</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="zone-label">Zone: Loading...</div>
    <div id="hint"></div>
    <div id="stamina"><div class="stamina-fill"></div><div class="stamina-ticks"></div></div>
  </div>

  <div id="hotbar"></div>

  <div id="inventory" hidden></div>

  <div id="sign-editor" hidden>
    <div class="sign-win">
      <div class="sign-title">Sign Text</div>
      <textarea id="sign-text" rows="4" maxlength="120" spellcheck="false"></textarea>
      <div class="sign-actions">
        <button class="sign-btn" id="sign-save">Save</button>
      </div>
      <div class="sign-hint">Enter to save &bull; Esc to cancel &bull; up to 4 lines</div>
    </div>
  </div>

  <div id="overlay">
    <h1>All Dogs Go To Minecraft</h1>
    <p id="overlay-title">The Testing Zone</p>
    <p id="overlay-text">Click to start</p>
    <div class="overlay-buttons">
      <button class="overlay-btn creative" id="overlay-creative">Creative</button>
      <button class="overlay-btn" id="overlay-instructions">Instructions</button>
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="js/core/constants.js"></script>
  <script src="js/world/blocks.js"></script>
  <script src="js/world/textures.js"></script>
  <script src="js/world/worldgen.js"></script>
  <script src="js/world/world.js"></script>
  <script src="js/world/structures/structure.js"></script>
  <script src="js/world/structures/house.js"></script>
  <script src="js/world/drops.js"></script>
  <script src="js/entity/entity.js"></script>
  <script src="js/entity/sign.js"></script>
  <script src="js/entity/chest.js"></script>
  <script src="js/entity/entityManager.js"></script>
  <script src="js/movement/input.js"></script>
  <script src="js/movement/player.js"></script>
  <script src="js/crafting/inventory.js"></script>
  <script src="js/crafting/recipes.js"></script>
  <script src="js/crafting/crafting.js"></script>
  <script src="js/zones/zone.js"></script>
  <script src="js/zones/zoneManager.js"></script>
  <script src="js/zones/testing.js"></script>
  <script src="js/core/raycast.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/hotbar.js"></script>
  <script src="js/ui/stamina.js"></script>
  <script src="js/ui/signEditor.js"></script>
  <script src="js/ui/inventoryPanel.js"></script>
  <script src="js/ui/debug.js"></script>
  <script src="js/ui/menuDebug.js"></script>
  <script src="js/mods/manifest.js"></script>
  <script src="js/mods/modLoader.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
