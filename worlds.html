<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a World</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="mod-header">
    <a href="controls.html">Controls</a>
    <h1>Choose a World</h1>
  </header>

  <div id="worlds">
    <section class="world-card">
      <h2>New World</h2>
      <p class="world-hint">Leave the seed blank for a random world.</p>
      <label class="world-field">
        <span>Seed</span>
        <input id="new-seed" type="text" inputmode="numeric" placeholder="random" />
      </label>
      <label class="world-check">
        <input id="new-creative" type="checkbox" />
        <span>Creative mode</span>
      </label>
      <button class="world-btn" id="new-create">Create World</button>
    </section>

    <section class="world-card">
      <h2>Load Saved World</h2>
      <p class="world-hint">Choose a world save file (.txt).</p>
      <label class="world-field">
        <span>Save file</span>
        <input id="load-file" type="file" accept=".txt,text/plain" />
      </label>
      <button class="world-btn" id="load-start">Load World</button>
    </section>

    <p id="worlds-error"></p>
  </div>

  <script src="js/core/constants.js"></script>
  <script src="js/world/worldSave.js"></script>
  <script>
  (function () {
    var newSeed = document.getElementById('new-seed');
    var newCreative = document.getElementById('new-creative');
    var newCreate = document.getElementById('new-create');
    var loadFile = document.getElementById('load-file');
    var loadStart = document.getElementById('load-start');
    var errorEl = document.getElementById('worlds-error');
    var configKey = 'adsgtm.world';

    function fail(message) {
      errorEl.textContent = message;
    }

    function start(config) {
      try { sessionStorage.setItem(configKey, JSON.stringify(config)); }
      catch (err) { fail('Could not start the world: ' + err.message); return; }
      window.location.href = 'index.html';
    }

    newCreate.addEventListener('click', function () {
      var raw = newSeed.value.trim();
      var seed;
      if (raw === '') {
        seed = Math.floor(Math.random() * 2000000000) - 1000000000;
      } else {
        seed = parseInt(raw, 10);
        if (!isFinite(seed)) { fail('Seed must be a whole number.'); return; }
      }
      fail('');
      start({ mode: 'new', seed: seed, creative: newCreative.checked });
    });

    loadStart.addEventListener('click', function () {
      var file = loadFile.files && loadFile.files[0];
      if (!file) { fail('Choose a save file first.'); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || '');
        var data = AllDogs.worldSave.parse(text);
        var valid = data && data.version >= 1 &&
          (data.seed !== null || data.blocks.length > 0 || data.placed.length > 0);
        if (!valid) { fail('That does not look like a world save file.'); return; }
        fail('');
        start({ mode: 'load', text: text });
      };
      reader.onerror = function () { fail('Could not read that file.'); };
      reader.readAsText(file);
    });
  })();
  </script>
</body>
</html>
